<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Mobile Web Profile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: white; width: 100%; max-width: 400px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); padding: 30px 20px; text-align: center; border: 1px solid #e2e8f0; }
        .avatar { width: 90px; height: 90px; border-radius: 50%; background: #e2e8f0; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 36px; }
        h1 { font-size: 22px; font-weight: 700; color: #0f172a; margin-bottom: 8px; }
        p { font-size: 14px; color: #64748b; line-height: 1.5; margin-bottom: 25px; }
        .links-container { display: flex; flex-direction: column; gap: 12px; }
        .btn { display: block; background-color: #0f172a; color: white; padding: 12px; border-radius: 8px; font-weight: 500; text-decoration: none; font-size: 14px; }
        .btn.secondary { background-color: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">⚡</div>
        <h1>SungJinWoo69110</h1>
        <p>Welcome to my free profile page hosted directly on GitHub Pages using mobile servers!</p>
        <div class="links-container">
            <a href="https://github.com" class="btn" target="_blank">My Projects</a>
            <a href="#" class="btn secondary">Contact Me</a>
        </div>
    </div>

</body>
</html>
